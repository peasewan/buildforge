name: Data and build checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run talents:validate
      - run: npm run talents:diff:json
      - run: npm run beta:changes:draft
      - run: npm run spellbook:validate
      - run: npm run pipeline:simulate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npm run seo:validate
